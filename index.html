<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hardware Query">
<title>Hardware Query</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#222}
header{background:#17365d;color:#fff;padding:22px 18px;font-size:23px;font-weight:700}
.container{max-width:900px;margin:auto;padding:18px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginBox{width:100%;max-width:400px;background:#fff;padding:30px;border-radius:18px;box-shadow:0 8px 30px #0002}
.loginBox h1{margin-top:0}
input,select,button{width:100%;padding:14px;margin-top:10px;border-radius:10px;border:1px solid #ccd3dc;font-size:16px}
button{background:#1769aa;color:#fff;border:0;font-weight:700}
.error{color:#d32f2f;margin-top:10px}
.hidden{display:none}
.panel{background:#fff;padding:18px;border-radius:14px;box-shadow:0 3px 12px #0001;margin-bottom:16px}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.menuBtn{min-height:130px;font-size:20px;background:#fff;color:#17365d;border:2px solid #d8e0ea;box-shadow:0 3px 12px #0001}
.menuBtn span{display:block;font-size:38px;margin-bottom:8px}
.back{background:#eef2f6;color:#263247;margin-top:0;margin-bottom:14px}
.section{margin-top:20px}
.sectionTitle{font-size:18px;font-weight:800;padding:12px 4px}
.card{background:#fff;margin:8px 0;padding:12px 15px;border-radius:12px;box-shadow:0 2px 8px #0001}
.label{font-size:12px;color:#777}
.value{font-size:16px;font-weight:600;margin-top:3px;word-break:break-word;white-space:pre-wrap}
.combo{background:linear-gradient(135deg,#17365d,#2467a5);color:#fff;padding:18px;border-radius:16px;margin-top:18px;box-shadow:0 5px 18px #0003}
.combo h2{margin:0 0 14px;font-size:20px}
.comboGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.comboItem{background:#ffffff18;border:1px solid #ffffff30;border-radius:10px;padding:10px}
.comboLabel{font-size:12px;opacity:.75}
.comboValue{margin-top:4px;font-weight:700;word-break:break-word;white-space:pre-wrap}
.resultCount{font-size:14px;color:#687386;margin-top:10px}
.partResult{cursor:pointer}
.partResult:hover{background:#f5f8fc}
.small{font-size:13px;color:#687386}
@media(max-width:600px){.menuGrid,.comboGrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loginPage" class="login">
 <div class="loginBox">
  <h1>🔐 Hardware Query</h1>
  <p>部門硬體資料查詢</p>
  <input id="password" type="password" placeholder="請輸入密碼"
   onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">登入</button>
  <div id="loginError" class="error"></div>
 </div>
</div>

<div id="mainPage" class="hidden">
<header>🔧 Hardware Query</header>
<div class="container">
 <div id="home">
  <div class="panel">
   <h2>請選擇查詢項目</h2>
   <div class="menuGrid">
    <button class="menuBtn" onclick="showProduct()"><span>📦</span>產品查詢</button>
    <button class="menuBtn" onclick="showPart()"><span>🏷️</span>料號查詢</button>
   </div>
  </div>
 </div>

 <div id="productPage" class="hidden">
  <button class="back" onclick="goHome()">← 回首頁</button>
  <div class="panel">
   <h2>📦 產品查詢</h2>
   <input id="modelSearch" placeholder="🔎 輸入 Model，例如 CODA6011UV" oninput="searchModel()">
   <select id="modelSelect" onchange="showModel()"><option value="">請選擇 Model</option></select>
  </div>
  <div id="productResult"></div>
 </div>

 <div id="partPage" class="hidden">
  <button class="back" onclick="goHome()">← 回首頁</button>
  <div class="panel">
   <h2>🏷️ 料號查詢</h2>
   <input id="partSearch" placeholder="🔎 輸入料號或 Description" oninput="searchPart()">
   <div id="partCount" class="resultCount"></div>
  </div>
  <div id="partResult"></div>
 </div>
</div>
</div>

<script src="data.js?v=3"></script>
<script src="parts.js?v=3"></script>
<script>
const PASSWORD="hitron-demo";
let models=(typeof HITRON_DATA!=="undefined" && Array.isArray(HITRON_DATA))?HITRON_DATA:[];
let parts=(typeof PARTS_DATA!=="undefined" && Array.isArray(PARTS_DATA))?PARTS_DATA:[];
let partTimer=null;

function login(){
 const pw=document.getElementById("password").value;
 if(pw===PASSWORD){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("mainPage").classList.remove("hidden");
  goHome();
 }else{
  document.getElementById("loginError").textContent="❌ 密碼錯誤";
 }
}

function hidePages(){
 document.getElementById("home").classList.add("hidden");
 document.getElementById("productPage").classList.add("hidden");
 document.getElementById("partPage").classList.add("hidden");
}
function goHome(){
 hidePages();
 document.getElementById("home").classList.remove("hidden");
}
function showProduct(){
 hidePages();
 document.getElementById("productPage").classList.remove("hidden");
 loadModels();
 document.getElementById("modelSearch").focus();
}
function showPart(){
 hidePages();
 document.getElementById("partPage").classList.remove("hidden");
 document.getElementById("partSearch").focus();
}

function loadModels(){
 const select=document.getElementById("modelSelect");
 select.innerHTML='<option value="">請選擇 Model</option>';
 models.forEach((m,i)=>{
  const o=document.createElement("option");
  o.value=i;o.textContent=m.model||m.Model||m.Product||("Model "+(i+1));
  select.appendChild(o);
 });
}
function searchModel(){
 const q=document.getElementById("modelSearch").value.trim().toLowerCase();
 const select=document.getElementById("modelSelect");
 if(!q){select.value="";document.getElementById("productResult").innerHTML="";return}
 const i=models.findIndex(m=>Object.values(m).some(v=>String(v??"").toLowerCase().includes(q)));
 if(i>=0){select.value=i;showModel()}
 else{select.value="";document.getElementById("productResult").innerHTML='<div class="card">找不到符合的 Model</div>'}
}
function showModel(){
 const i=document.getElementById("modelSelect").value;
 if(i===""){document.getElementById("productResult").innerHTML="";return}
 renderProduct(models[i]);
}

function category(key){
 const k=key.toLowerCase();
 if(k.includes("product")||k==="model")return"model";
 if(k.includes("processor")||k.includes("cpu")||k.includes("memory")||k.includes("ddr")||k.includes("ram")||k.includes("flash")||k.includes("pga"))return"processing";
 if(k.includes("tuner")||k.includes("diplexer")||k.includes("rf")||k.includes("docsis")||k.includes("phy")||k.includes("qam")||k.includes("upstream")||k.includes("downstream")||k.includes("forward")||k.includes("return"))return"rf";
 if(k.includes("wifi")||k.includes("wlan")||k.includes("lan")||k.includes("ethernet")||k.includes("voice")||k.includes("fxs")||k.includes("usb")||k.includes("bluetooth"))return"connectivity";
 return"other";
}
function findValue(data,words){
 const key=Object.keys(data).find(k=>words.some(w=>k.toLowerCase().includes(w)));
 return key?data[key]:"-";
}
function hardwareCombo(data){
 const items=[
  ["CPU / PROCESSOR",findValue(data,["processor","cpu"])],
  ["TUNER",findValue(data,["tuner"])],
  ["PGA",findValue(data,["pga"])],
  ["MEMORY",findValue(data,["memory","ddr","ram"])],
  ["RF / DIPLEXER",findValue(data,["diplexer"])],
  ["WIFI",Object.entries(data).filter(([k])=>/wifi/i.test(k)).map(([,v])=>v).filter(Boolean).join(" / ")||"-"],
  ["LAN",Object.entries(data).filter(([k])=>/lan|ethernet/i.test(k)).map(([,v])=>v).filter(Boolean).join(" / ")||"-"],
  ["VOICE",findValue(data,["voice","fxs"])]
 ];
 return '<div class="combo"><h2>🔧 Hardware 組合</h2><div class="comboGrid">'+items.map(x=>`<div class="comboItem"><div class="comboLabel">${x[0]}</div><div class="comboValue">${safe(x[1])}</div></div>`).join("")+'</div></div>';
}
function renderProduct(data){
 const groups={model:[],processing:[],rf:[],connectivity:[],other:[]};
 Object.entries(data).forEach(([k,v])=>{if(v!==null&&v!==undefined&&v!=="")groups[category(k)].push([k,v])});
 const titles={model:"📦 Model Information",processing:"⚙️ Processing",rf:"📡 RF / DOCSIS",connectivity:"📶 Connectivity",other:"🔧 Other Hardware"};
 let html=hardwareCombo(data);
 Object.keys(groups).forEach(g=>{
  if(!groups[g].length)return;
  html+=`<div class="section"><div class="sectionTitle">${titles[g]}</div>`;
  groups[g].forEach(([k,v])=>html+=`<div class="card"><div class="label">${safe(k)}</div><div class="value">${safe(v)}</div></div>`);
  html+="</div>";
 });
 document.getElementById("productResult").innerHTML=html;
}

function searchPart(){
 clearTimeout(partTimer);
 partTimer=setTimeout(runPartSearch,120);
}
function runPartSearch(){
 const q=document.getElementById("partSearch").value.trim().toLowerCase();
 const box=document.getElementById("partResult");
 const count=document.getElementById("partCount");
 if(!q){box.innerHTML="";count.textContent="";return}
 const hits=parts.filter(p=>
  String(p["Part Number"]||"").toLowerCase().includes(q)||
  String(p["Description"]||"").toLowerCase().includes(q)||
  String(p["廠商料號MPN"]||"").toLowerCase().includes(q)||
  String(p["廠商名稱"]||"").toLowerCase().includes(q)
 );
 count.textContent=`找到 ${hits.length.toLocaleString()} 筆${hits.length>100?"，顯示前 100 筆":""}`;
 if(!hits.length){box.innerHTML='<div class="card">找不到符合的料號或 Description</div>';return}
 box.innerHTML=hits.slice(0,100).map(p=>`
  <div class="card partResult" onclick='showPartDetail(${JSON.stringify(p).replace(/'/g,"&#39;")})'>
   <div class="value">${safe(p["Part Number"])}</div>
   <div class="small">${safe(p["Description"])}</div>
  </div>`).join("");
}
function showPartDetail(p){
 const fields=["Part Number","Description","廠商料號MPN","廠商名稱"];
 document.getElementById("partResult").innerHTML=
  '<button class="back" onclick="runPartSearch()">← 回搜尋結果</button>'+
  fields.map(k=>`<div class="card"><div class="label">${safe(k)}</div><div class="value">${safe(p[k]||"-")}</div></div>`).join("");
}
function safe(v){
 return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
</script>
</body>
</html>
