<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hitron Hardware Query">

<link rel="manifest" href="manifest.webmanifest">

<title>Hitron Hardware Query</title>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#f3f5f8;
 color:#172033;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
 max-width:760px;
 margin:auto;
 padding:18px 14px 50px;
}

.card{
 background:white;
 border-radius:20px;
 padding:18px;
 margin-bottom:14px;
 box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.login{
 min-height:90vh;
 display:flex;
 align-items:center;
 justify-content:center;
}

.login .card{
 width:100%;
 max-width:430px;
}

.logo{
 width:64px;
 height:64px;
 border-radius:18px;
 background:#0b5cff;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:38px;
 font-weight:800;
 margin-bottom:15px;
}

h1{
 font-size:28px;
 margin:5px 0 8px;
}

h2{
 margin:0;
}

.muted{
 color:#687386;
}

.badge{
 display:inline-block;
 padding:7px 12px;
 border-radius:999px;
 background:#eaf1ff;
 color:#0b5cff;
 font-weight:700;
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

input,
select,
button{
 width:100%;
 height:50px;
 border-radius:14px;
 border:1px solid #d9dee8;
 background:white;
 padding:0 14px;
 font-size:17px;
}

input{
 margin-top:15px;
}

button{
 margin-top:10px;
 border:0;
 background:#0b5cff;
 color:white;
 font-weight:700;
}

.logout{
 width:auto;
 margin:0;
 background:#eef2f7;
 color:#263247;
}

.model-title{
 font-size:30px;
 font-weight:800;
 margin-bottom:5px;
}

.section{
 margin-top:22px;
}

.section-title{
 font-size:20px;
 font-weight:800;
 margin-bottom:10px;
}

.hw{
 border:1px solid #e0e5ed;
 border-radius:14px;
 padding:12px 14px;
 margin-bottom:8px;
 background:white;
}

.hw-label{
 color:#687386;
 font-size:13px;
 font-weight:700;
 margin-bottom:5px;
}

.hw-value{
 font-size:16px;
 line-height:1.45;
 white-space:pre-line;
 word-break:break-word;
}

/* Hardware 組合 */

.combo{
 margin-top:20px;
 border:1px solid #dce5ff;
 border-radius:18px;
 padding:16px;
 background:#f7f9ff;
}

.combo-title{
 font-size:21px;
 font-weight:800;
 margin-bottom:12px;
}

.combo-item{
 background:white;
 border:1px solid #e0e5ed;
 border-radius:13px;
 padding:12px;
 margin-bottom:8px;
}

.combo-label{
 color:#687386;
 font-size:12px;
 font-weight:700;
 margin-bottom:4px;
}

.combo-value{
 font-size:16px;
 line-height:1.45;
 white-space:pre-line;
 word-break:break-word;
}

.error{
 background:#fff0f0;
 color:#b42318;
 border:1px solid #ffd0d0;
 border-radius:14px;
 padding:15px;
}

@media(min-width:620px){

.hw-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.hw-grid .hw{
 margin-bottom:0;
}

}

</style>
</head>

<body>

<div id="app"></div>

<script src="./data.js"></script>

<script>

/* =========================
   基本安全處理
========================= */

function safe(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================
   檢查資料
========================= */

const app=document.getElementById("app");

if(!Array.isArray(window.HITRON_DATA)){

 app.innerHTML=`

 <div class="wrap">

  <div class="card">

   <h1>⚠️ 資料載入失敗</h1>

   <p class="muted">
   data.js 沒有正確載入。
   </p>

   <div class="error">
   請重新整理頁面。
   </div>

  </div>

 </div>

 `;

 throw new Error("HITRON_DATA not loaded");

}


/* =========================
   LOGIN
========================= */

function login(){

 app.innerHTML=`

 <div class="wrap login">

  <div class="card">

   <div class="logo">H</div>

   <h1>Hitron Hardware Query</h1>

   <p class="muted">
   公司硬體資料查詢
   </p>

   <input
    id="password"
    type="password"
    placeholder="輸入查詢密碼">

   <button id="loginButton">
    登入
   </button>

   <div id="loginError"
    style="display:none;color:#c62828;margin-top:10px">
    密碼錯誤
   </div>

  </div>

 </div>

 `;


 document.getElementById("loginButton").onclick=()=>{

  const pw=document.getElementById("password").value;

  if(pw==="hitron-demo"){

   sessionStorage.setItem("hitronLogin","1");

   showQuery();

  }else{

   document.getElementById("loginError").style.display="block";

  }

 };


 document.getElementById("password").onkeydown=e=>{

  if(e.key==="Enter"){

   document.getElementById("loginButton").click();

  }

 };

}


/* =========================
   分類
========================= */

function category(key){

 const k=key
  .toLowerCase()
  .replace(/[\s_-]/g,"");


 if(k==="product")
  return "model";


 if(
  k.includes("processor") ||
  k.includes("cpu") ||
  k.includes("tuner") ||
  k.includes("pga") ||
  k.includes("memory") ||
  k.includes("ddr") ||
  k.includes("ram") ||
  k.includes("flash")
 )
  return "processing";


 if(
  k.includes("diplexer") ||
  k.includes("rf") ||
  k.includes("docsis") ||
  k.includes("phy") ||
  k.includes("qam") ||
  k.includes("upstream") ||
  k.includes("downstream") ||
  k.includes("fwd") ||
  k.includes("return")
 )
  return "rf";


 if(
  k.includes("wifi") ||
  k.includes("wlan") ||
  k.includes("lan") ||
  k.includes("ethernet") ||
  k.includes("voice") ||
  k.includes("fxs") ||
  k.includes("usb") ||
  k.includes("bluetooth")
 )
  return "connectivity";


 return "other";

}


function categoryTitle(type){

 if(type==="model")
  return "📦 Model Information";

 if(type==="processing")
  return "⚙️ Processing";

 if(type==="rf")
  return "📡 RF / DOCSIS";

 if(type==="connectivity")
  return "📶 Connectivity";

 return "🔧 Other Hardware";

}


/* =========================
   Hardware 組合
========================= */

function hardwareCombo(x){

 const keys=[

  ["Processor","🧠 CPU / PROCESSOR"],

  ["Tuner","📡 TUNER"],

  ["PGA","🔧 PGA"],

  ["Memory","💾 MEMORY"],

  ["Diplexer","📻 RF / DIPLEXER"]

 ];


 let html="";

 keys.forEach(item=>{

  const key=item[0];
  const label=item[1];

  if(x[key]){

   html+=`

   <div class="combo-item">

    <div class="combo-label">
    ${label}
    </div>

    <div class="combo-value">
    ${safe(x[key])}
    </div>

   </div>

   `;

  }

 });


 const wifiKeys=Object.keys(x)
  .filter(k=>k.toLowerCase().includes("wifi"));

 if(wifiKeys.length){

  html+=`

  <div class="combo-item">

   <div class="combo-label">
   📶 WIFI
   </div>

   <div class="combo-value">

   ${
    wifiKeys
    .map(k=>safe(k)+"："+safe(x[k]))
    .join("\n")
   }

   </div>

  </div>

  `;

 }


 const lanKeys=Object.keys(x)
  .filter(k=>k.toLowerCase().includes("lan"));

 if(lanKeys.length){

  html+=`

  <div class="combo-item">

   <div class="combo-label">
   🌐 LAN
   </div>

   <div class="combo-value">

   ${
    lanKeys
    .map(k=>safe(k)+"："+safe(x[k]))
    .join("\n")
   }

   </div>

  </div>

  `;

 }


 if(x.Voice){

  html+=`

  <div class="combo-item">

   <div class="combo-label">
   ☎️ VOICE
   </div>

   <div class="combo-value">
   ${safe(x.Voice)}
   </div>

  </div>

  `;

 }


 if(!html)
  return "";


 return `

 <div class="combo">

  <div class="combo-title">
  🧩 Hardware 組合
  </div>

  ${html}

 </div>

 `;

}


/* =========================
   QUERY PAGE
========================= */

function showQuery(){

 app.innerHTML=`

 <div class="wrap">

  <div class="card">

   <div class="top">

    <div>

     <span class="badge">
     Hardware Query
     </span>

     <h1>
     Model 搜尋
     </h1>

    </div>

    <button
     id="logout"
     class="logout">

     登出

    </button>

   </div>

   <input
    id="search"
    placeholder="🔎 輸入 Model，例如 CODA6011UV">

   <select id="model"></select>

  </div>

  <div id="detail"></div>

 </div>

 `;


 const search=document.getElementById("search");
 const select=document.getElementById("model");
 const detail=document.getElementById("detail");


 document.getElementById("logout").onclick=()=>{

  sessionStorage.removeItem("hitronLogin");

  login();

 };


 function renderList(){

  const q=search.value.trim().toLowerCase();

  const list=HITRON_DATA.filter(x=>{

   return String(x.model||"")
    .toLowerCase()
    .includes(q)

    ||

    String(x.Product||"")
    .toLowerCase()
    .includes(q);

  });


  if(!list.length){

   select.innerHTML="";

   detail.innerHTML=`

   <div class="card">

    <h2>找不到資料</h2>

    <p class="muted">
    請確認 Model 或 Product。
    </p>

   </div>

   `;

   return;

  }


  select.innerHTML=list
   .map(x=>{

    const index=HITRON_DATA.indexOf(x);

    return `

    <option value="${index}">
    ${safe(x.model)}
    </option>

    `;

   })
   .join("");


  renderModel();

 }


 function renderModel(){

  const x=HITRON_DATA[
   Number(select.value)
  ];

  if(!x)
   return;


  const groups={

   model:[],
   processing:[],
   rf:[],
   connectivity:[],
   other:[]

  };


  Object.keys(x).forEach(key=>{

   if(key==="model")
    return;

   if(x[key]===undefined ||
      x[key]===null ||
      x[key]==="")
    return;

   const type=category(key);

   groups[type].push({

    key:key,
    value:x[key]

   });

  });


  let html=`

  <div class="card">

   <div class="model-title">
   ${safe(x.model)}
   </div>

   <p class="muted">
   ${safe(x.Product||"")}
   </p>

   ${hardwareCombo(x)}

  `;


  [
   "model",
   "processing",
   "rf",
   "connectivity",
   "other"

  ].forEach(type=>{

   if(!groups[type].length)
    return;


   html+=`

   <div class="section">

    <div class="section-title">
    ${categoryTitle(type)}
    </div>

    <div class="hw-grid">

   `;


   groups[type].forEach(item=>{

    html+=`

    <div class="hw">

     <div class="hw-label">
     ${safe(item.key)}
     </div>

     <div class="hw-value">
     ${safe(item.value)}
     </div>

    </div>

    `;

   });


   html+=`

    </div>

   </div>

   `;

  });


  html+=`

  </div>

  `;


  detail.innerHTML=html;

 }


 search.oninput=renderList;

 select.onchange=renderModel;

 renderList();

}


/* =========================
   START
========================= */

if(
 sessionStorage.getItem("hitronLogin")==="1"
){

 showQuery();

}else{

 login();

}


/*
  注意：
  這個版本故意不註冊 Service Worker。
  等功能確認正常後再重新加入。
*/

</script>

</body>
</html>
