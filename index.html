<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hitron Model">
<link rel="manifest" href="manifest.webmanifest">

<title>Hitron Model Query</title>
<style>
:root{color-scheme:light;--bg:#f4f6fa;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC",sans-serif;color:var(--text)}
main{max-width:720px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 32px}
h1{font-size:27px;margin:4px 0 4px}.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}input,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font-size:16px;outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #2563eb22}
.grid{display:grid;grid-template-columns:1fr;gap:10px}.row{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px}.key{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.val{font-size:15px;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:12px;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 9px;margin-top:5px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}button{border:0;background:#eef2ff;border-radius:10px;padding:8px 10px;font-weight:600}.empty{text-align:center;color:var(--muted);padding:30px 10px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
</style>
</head>
<body>
<main>
  <h1>Hitron Model Query</h1>
  <div class="sub">產品機種 → 硬體組合查詢</div>
  <section class="panel">
    <label for="search">搜尋 Model / Product</label>
    <input id="search" placeholder="例如 CODA6011、WiFi7、DOCSIS 4.0…" autocomplete="off">
  </section>
  <section class="panel">
    <label for="model">產品名稱</label>
    <select id="model"><option value="">請選擇產品機種</option></select>
  </section>
  <div id="result" class="empty">請選擇產品機種</div>
</main>

const sel=document.getElementById('model'), search=document.getElementById('search'), result=document.getElementById('result');

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fillOptions(filter='') {
  const f=filter.trim().toLowerCase();
  sel.innerHTML='<option value="">請選擇產品機種</option>';
  DATA.forEach((x,i)=>{
    const text=(x.model+' '+(x.Product||'')).toLowerCase();
    if(!f || text.includes(f)) {
      const o=document.createElement('option'); o.value=i; o.textContent=x.model; sel.appendChild(o);
    }
  });
}
function show(i) {
  const x=DATA[Number(i)];
  if(!x){result.className='empty';result.textContent='請選擇產品機種';return}
  let html='<section class="panel"><div class="top"><div><h2 style="margin:0;font-size:21px">'+esc(x.model)+'</h2><div class="badge">'+esc(x.Product||'')+'</div></div></div></section><div class="grid">';
  CATS.filter(k=>x[k]!==undefined && x[k]!=='').forEach(k=>{
    html+='<article class="row '+(k==='Product'?'wide':'')+'"><div class="key">'+esc(k)+'</div><div class="val">'+esc(x[k])+'</div></article>';
  });
  html+='</div>'; result.className=''; result.innerHTML=html;
}
search.addEventListener('input',()=>{fillOptions(search.value); if(sel.options.length===2){sel.selectedIndex=1;show(sel.value)}});
sel.addEventListener('change',()=>show(sel.value));
fillOptions();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
