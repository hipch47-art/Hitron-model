<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hitron HW">
<link rel="manifest" href="manifest.webmanifest">
<title>Hitron Hardware Query</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:#f3f5f8;
 color:#172033
}

.wrap{
 max-width:760px;
 margin:auto;
 padding:20px 14px 45px
}

.card{
 background:#fff;
 border-radius:18px;
 padding:18px;
 box-shadow:0 5px 20px #00000010;
 margin-bottom:14px
}

h1{
 font-size:25px;
 margin:4px 0 8px
}

h2{
 font-size:20px;
 margin:0
}

.muted{color:#687386}

.login{
 min-height:85vh;
 display:flex;
 align-items:center;
 justify-content:center
}

.login .card{
 width:100%;
 max-width:430px
}

.logo{
 width:64px;
 height:64px;
 border-radius:18px;
 background:#0b5cff;
 color:#fff;
 font-size:38px;
 font-weight:800;
 display:flex;
 align-items:center;
 justify-content:center;
 margin-bottom:16px
}

input,select,button{
 width:100%;
 height:48px;
 border:1px solid #d9dee8;
 border-radius:12px;
 padding:0 14px;
 font-size:16px;
 background:#fff
}

button{
 background:#0b5cff;
 color:#fff;
 border:0;
 font-weight:700;
 margin-top:10px
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px
}

.logout{
 width:auto;
 padding:0 15px;
 background:#eef2f7;
 color:#263247;
 margin:0
}

.search{margin:14px 0}

.badge{
 display:inline-block;
 background:#eaf1ff;
 color:#0b5cff;
 border-radius:999px;
 padding:6px 10px;
 font-weight:700;
 font-size:13px
}

.section{
 margin-top:18px
}

.section-title{
 font-size:17px;
 font-weight:800;
 margin-bottom:9px
}

.grid{
 display:grid;
 grid-template-columns:1fr;
 gap:8px
}

.hw{
 border:1px solid #e3e7ee;
 border-radius:12px;
 padding:11px 13px;
 background:#fff
}

.hw b{
 display:block;
 font-size:12px;
 color:#687386;
 margin-bottom:4px
}

.hw div{
 word-break:break-word;
 line-height:1.4;
 font-size:15px
}

@media(min-width:620px){
 .grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<div id="app"></div>

<script src="data.js"></script>

<script>

/* =========================
   LOGIN
========================= */

const app=document.getElementById("app");

function login(){

app.innerHTML=`
<div class="wrap login">
<div class="card">

<div class="logo">H</div>

<h1>Hitron Hardware Query</h1>

<p class="muted">公司硬體資料查詢</p>

<input
 id="pw"
 type="password"
 placeholder="輸入查詢密碼">

<button id="go">登入</button>

<div id="err"
 style="color:#c62828;margin-top:9px;display:none">
密碼錯誤
</div>

<p class="muted"
 style="font-size:12px;margin-top:15px">
🔐 Hardware Query System
</p>

</div>
</div>
`;

document.getElementById("go").onclick=()=>{

if(document.getElementById("pw").value==="hitron-demo"){

sessionStorage.ok="1";
query();

}else{

document.getElementById("err").style.display="block";

}

};

document.getElementById("pw").onkeydown=e=>{

if(e.key==="Enter")
document.getElementById("go").click();

};

}


/* =========================
   QUERY
========================= */

function query(){

app.innerHTML=`
<div class="wrap">

<div class="card">

<div class="top">

<div>
<span class="badge">Hardware Query</span>
<h1>Model 搜尋</h1>
</div>

<button class="logout" id="out">登出</button>

</div>

<input
 class="search"
 id="search"
 placeholder="🔎 輸入 Model，例如 CODA6011UV">

<select id="model"></select>

</div>

<div id="detail"></div>

</div>
`;

document.getElementById("out").onclick=()=>{

sessionStorage.removeItem("ok");
login();

};

const search=document.getElementById("search");
const model=document.getElementById("model");
const detail=document.getElementById("detail");


/* =========================
   SEARCH
========================= */

function fill(){

const q=search.value.trim().toLowerCase();

const list=HITRON_DATA.filter(x=>
(x.model||"").toLowerCase().includes(q) ||
(x.Product||"").toLowerCase().includes(q)
);

if(!list.length){

model.innerHTML="";

detail.innerHTML=`
<div class="card" style="text-align:center">
<h2>找不到資料</h2>
<p class="muted">請確認 Model 或 Product。</p>
</div>
`;

return;

}

model.innerHTML=list.map(x=>
`<option value="${HITRON_DATA.indexOf(x)}">${x.model}</option>`
).join("");

show();

}


/* =========================
   CATEGORY
========================= */

function getCategory(key){

const k=key.toLowerCase().replace(/[\s_-]/g,"");


/* Model */

if(k==="product")
return "model";


/* Processing */

if(
k.includes("processor") ||
k.includes("cpu") ||
k.includes("tuner") ||
k.includes("pga") ||
k.includes("memory") ||
k.includes("ddr") ||
k.includes("ram") ||
k.includes("flash")
)
return "processing";


/* RF / DOCSIS */

if(
k.includes("diplexer") ||
k.includes("rf") ||
k.includes("docsis") ||
k.includes("phy") ||
k.includes("qam") ||
k.includes("upstream") ||
k.includes("downstream") ||
k.includes("fwd") ||
k.includes("return")
)
return "rf";


/* Connectivity */

if(
k.includes("wifi") ||
k.includes("wlan") ||
k.includes("lan") ||
k.includes("ethernet") ||
k.includes("voice") ||
k.includes("fxs") ||
k.includes("usb") ||
k.includes("bluetooth")
)
return "connectivity";


return "other";

}


/* =========================
   SECTION TITLE
========================= */

function title(type){

if(type==="model")
return "📦 Model Information";

if(type==="processing")
return "⚙️ Processing";

if(type==="rf")
return "📡 RF / DOCSIS";

if(type==="connectivity")
return "📶 Connectivity";

return "🔧 Other Hardware";

}


/* =========================
   HTML SAFE
========================= */

function safe(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   SHOW HARDWARE
========================= */

function show(){

const x=HITRON_DATA[+model.value];

if(!x)return;

const groups={
 model:[],
 processing:[],
 rf:[],
 connectivity:[],
 other:[]
};

Object.keys(x).forEach(key=>{

if(key==="model" || !x[key])return;

const type=getCategory(key);

groups[type].push({
 key:key,
 value:x[key]
});

});


let html=`

<div class="card">

<h1>${safe(x.model)}</h1>

<p class="muted">
${safe(x.Product||"")}
</p>
`;


/* =========================
   RENDER GROUP
========================= */

["model","processing","rf","connectivity","other"]
.forEach(type=>{

if(!groups[type].length)return;

html+=`

<div class="section">

<div class="section-title">
${title(type)}
</div>

<div class="grid">
`;

groups[type].forEach(item=>{

html+=`

<div class="hw">

<b>${safe(item.key)}</b>

<div>
${safe(item.value)}
</div>

</div>
`;

});

html+=`

</div>

</div>
`;

});


html+=`

</div>
`;

detail.innerHTML=html;

}


search.oninput=fill;
model.onchange=show;

fill();

}


/* =========================
   START
========================= */

if(sessionStorage.ok==="1")
query();
else
login();


/* =========================
   SERVICE WORKER
========================= */

if("serviceWorker" in navigator){

navigator.serviceWorker.register("sw.js");

}

</script>

</body>
</html>
