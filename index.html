<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hitron HW">
<link rel="manifest" href="manifest.webmanifest">
<title>Hitron Hardware Query</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:#f3f5f8;
 color:#172033
}

.wrap{
 max-width:760px;
 margin:auto;
 padding:20px 14px 50px
}

.card{
 background:#fff;
 border-radius:20px;
 padding:18px;
 box-shadow:0 5px 20px #00000010;
 margin-bottom:14px
}

h1{
 font-size:26px;
 margin:5px 0 8px
}

h2{
 font-size:20px;
 margin:0
}

.muted{
 color:#687386
}

.login{
 min-height:85vh;
 display:flex;
 align-items:center;
 justify-content:center
}

.login .card{
 width:100%;
 max-width:430px
}

.logo{
 width:64px;
 height:64px;
 border-radius:18px;
 background:#0b5cff;
 color:#fff;
 font-size:38px;
 font-weight:800;
 display:flex;
 align-items:center;
 justify-content:center;
 margin-bottom:16px
}

input,select,button{
 width:100%;
 height:50px;
 border:1px solid #d9dee8;
 border-radius:14px;
 padding:0 14px;
 font-size:17px;
 background:#fff
}

button{
 background:#0b5cff;
 color:#fff;
 border:0;
 font-weight:700;
 margin-top:10px
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px
}

.logout{
 width:auto;
 padding:0 16px;
 background:#eef2f7;
 color:#263247;
 margin:0
}

.search{
 margin:14px 0
}

.badge{
 display:inline-block;
 background:#eaf1ff;
 color:#0b5cff;
 border-radius:999px;
 padding:7px 12px;
 font-weight:700;
 font-size:14px
}

.model-title{
 font-size:30px;
 font-weight:800;
 margin-top:5px
}

.section{
 margin-top:20px
}

.section-title{
 font-size:20px;
 font-weight:800;
 margin-bottom:10px
}

.grid{
 display:grid;
 grid-template-columns:1fr;
 gap:8px
}

.hw{
 border:1px solid #e0e5ed;
 border-radius:14px;
 padding:12px 14px;
 background:#fff
}

.hw b{
 display:block;
 font-size:13px;
 color:#687386;
 margin-bottom:5px
}

.hw div{
 word-break:break-word;
 line-height:1.45;
 font-size:16px
}

/* Hardware 組合 */

.combo{
 border-radius:18px;
 background:linear-gradient(135deg,#f4f7ff,#ffffff);
 border:1px solid #dce5ff;
 padding:16px;
 margin-top:18px
}

.combo-title{
 font-size:21px;
 font-weight:800;
 margin-bottom:13px
}

.combo-grid{
 display:grid;
 grid-template-columns:1fr;
 gap:9px
}

.combo-item{
 background:#fff;
 border:1px solid #e0e5ed;
 border-radius:13px;
 padding:11px 13px
}

.combo-label{
 font-size:12px;
 font-weight:700;
 color:#687386;
 margin-bottom:4px
}

.combo-value{
 font-size:15px;
 line-height:1.4;
 word-break:break-word
}

.combo-wide{
 grid-column:1/-1
}

.empty{
 text-align:center;
 padding:25px
}

@media(min-width:620px){

 .grid{
  grid-template-columns:1fr 1fr
 }

 .combo-grid{
  grid-template-columns:1fr 1fr
 }

}

</style>
</head>

<body>

<div id="app"></div>

<script src="data.js"></script>

<script>

/* =========================
   LOGIN
========================= */

const app=document.getElementById("app");

function login(){

app.innerHTML=`

<div class="wrap login">

<div class="card">

<div class="logo">H</div>

<h1>Hitron Hardware Query</h1>

<p class="muted">
公司硬體資料查詢
</p>

<input
 id="pw"
 type="password"
 placeholder="輸入查詢密碼">

<button id="go">
登入
</button>

<div id="err"
 style="color:#c62828;margin-top:9px;display:none">
密碼錯誤
</div>

<p class="muted"
 style="font-size:12px;margin-top:15px">
🔐 Hardware Query System
</p>

</div>
</div>
`;

document.getElementById("go").onclick=()=>{

if(document.getElementById("pw").value==="hitron-demo"){

sessionStorage.ok="1";
query();

}else{

document.getElementById("err").style.display="block";

}

};

document.getElementById("pw").onkeydown=e=>{

if(e.key==="Enter")
document.getElementById("go").click();

};

}


/* =========================
   QUERY
========================= */

function query(){

app.innerHTML=`

<div class="wrap">

<div class="card">

<div class="top">

<div>

<span class="badge">
Hardware Query
</span>

<h1>
Model 搜尋
</h1>

</div>

<button class="logout" id="out">
登出
</button>

</div>

<input
 class="search"
 id="search"
 placeholder="🔎 輸入 Model，例如 CODA6011UV">

<select id="model"></select>

</div>

<div id="detail"></div>

</div>
`;

document.getElementById("out").onclick=()=>{

sessionStorage.removeItem("ok");
login();

};

const search=document.getElementById("search");
const model=document.getElementById("model");
const detail=document.getElementById("detail");


/* =========================
   SEARCH
========================= */

function fill(){

const q=search.value.trim().toLowerCase();

const list=HITRON_DATA.filter(x=>

(x.model||"").toLowerCase().includes(q) ||

(x.Product||"").toLowerCase().includes(q)

);

if(!list.length){

model.innerHTML="";

detail.innerHTML=`

<div class="card empty">

<h2>
找不到資料
</h2>

<p class="muted">
請確認 Model 或 Product。
</p>

</div>
`;

return;

}

model.innerHTML=list.map(x=>

`<option value="${HITRON_DATA.indexOf(x)}">
${safe(x.model)}
</option>`

).join("");

show();

}


/* =========================
   CATEGORY
========================= */

function getCategory(key){

const k=key.toLowerCase().replace(/[\s_-]/g,"");

if(k==="product")
return "model";

if(
 k.includes("processor") ||
 k.includes("cpu") ||
 k.includes("tuner") ||
 k.includes("pga") ||
 k.includes("memory") ||
 k.includes("ddr") ||
 k.includes("ram") ||
 k.includes("flash")
)
return "processing";

if(
 k.includes("diplexer") ||
 k.includes("rf") ||
 k.includes("docsis") ||
 k.includes("phy") ||
 k.includes("qam") ||
 k.includes("upstream") ||
 k.includes("downstream") ||
 k.includes("fwd") ||
 k.includes("return")
)
return "rf";

if(
 k.includes("wifi") ||
 k.includes("wlan") ||
 k.includes("lan") ||
 k.includes("ethernet") ||
 k.includes("voice") ||
 k.includes("fxs") ||
 k.includes("usb") ||
 k.includes("bluetooth")
)
return "connectivity";

return "other";

}


/* =========================
   SECTION TITLE
========================= */

function title(type){

if(type==="model")
return "📦 Model Information";

if(type==="processing")
return "⚙️ Processing";

if(type==="rf")
return "📡 RF / DOCSIS";

if(type==="connectivity")
return "📶 Connectivity";

return "🔧 Other Hardware";

}


/* =========================
   HTML SAFE
========================= */

function safe(value){

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;")

.replace(/\n/g,"<br>");

}


/* =========================
   HARDWARE 組合
========================= */

function hardwareCombo(x){

const items=[];


/* Processor */

if(x.Processor){

items.push(`
<div class="combo-item">

<div class="combo-label">
CPU / PROCESSOR
</div>

<div class="combo-value">
${safe(x.Processor)}
</div>

</div>
`);

}


/* Tuner */

if(x.Tuner){

items.push(`
<div class="combo-item">

<div class="combo-label">
TUNER
</div>

<div class="combo-value">
${safe(x.Tuner)}
</div>

</div>
`);

}


/* PGA */

if(x.PGA){

items.push(`
<div class="combo-item">

<div class="combo-label">
PGA
</div>

<div class="combo-value">
${safe(x.PGA)}
</div>

</div>
`);

}


/* Memory */

if(x.Memory){

items.push(`
<div class="combo-item">

<div class="combo-label">
MEMORY
</div>

<div class="combo-value">
${safe(x.Memory)}
</div>

</div>
`);

}


/* Diplexer */

if(x.Diplexer){

items.push(`
<div class="combo-item combo-wide">

<div class="combo-label">
RF / DIPLEXER
</div>

<div class="combo-value">
${safe(x.Diplexer)}
</div>

</div>
`);

}


/* WiFi */

const wifiKeys=Object.keys(x).filter(k=>
k.toLowerCase().includes("wifi")
);

if(wifiKeys.length){

let wifiText=wifiKeys.map(k=>
`${safe(k)}：${safe(x[k])}`
).join("<br>");

items.push(`
<div class="combo-item combo-wide">

<div class="combo-label">
📶 WIFI
</div>

<div class="combo-value">
${wifiText}
</div>

</div>
`);

}


/* LAN */

const lanKeys=Object.keys(x).filter(k=>
k.toLowerCase().includes("lan")
);

if(lanKeys.length){

let lanText=lanKeys.map(k=>
`${safe(k)}：${safe(x[k])}`
).join("<br>");

items.push(`
<div class="combo-item">

<div class="combo-label">
🌐 LAN
</div>

<div class="combo-value">
${lanText}
</div>

</div>
`);

}


/* Voice */

if(x.Voice){

items.push(`
<div class="combo-item">

<div class="combo-label">
☎️ VOICE
</div>

<div class="combo-value">
${safe(x.Voice)}
</div>

</div>
`);

}


if(!items.length)
return "";

return `

<div class="combo">

<div class="combo-title">
🧩 Hardware 組合
</div>

<div class="combo-grid">

${items.join("")}

</div>

</div>
`;

}


/* =========================
   SHOW HARDWARE
========================= */

function show(){

const x=HITRON_DATA[+model.value];

if(!x)return;

const groups={

model:[],
processing:[],
rf:[],
connectivity:[],
other:[]

};


Object.keys(x).forEach(key=>{

if(key==="model" || !x[key])
return;

const type=getCategory(key);

groups[type].push({

key:key,
value:x[key]

});

});


let html=`

<div class="card">

<div class="model-title">
${safe(x.model)}
</div>

<p class="muted">
${safe(x.Product||"")}
</p>

${hardwareCombo(x)}

`;


/* =========================
   CATEGORY RENDER
========================= */

[
"model",
"processing",
"rf",
"connectivity",
"other"

].forEach(type=>{

if(!groups[type].length)
return;

html+=`

<div class="section">

<div class="section-title">
${title(type)}
</div>

<div class="grid">

`;

groups[type].forEach(item=>{

html+=`

<div class="hw">

<b>
${safe(item.key)}
</b>

<div>
${safe(item.value)}
</div>

</div>

`;

});

html+=`

</div>
</div>

`;

});


html+=`

</div>
`;

detail.innerHTML=html;

}


/* =========================
   EVENTS
========================= */

search.oninput=fill;

model.onchange=show;


/* =========================
   START
========================= */

if(sessionStorage.ok==="1")
query();
else
login();


/* =========================
   SERVICE WORKER
========================= */

if("serviceWorker" in navigator){

navigator.serviceWorker.register("sw.js");

}

</script>

</body>
</html>
